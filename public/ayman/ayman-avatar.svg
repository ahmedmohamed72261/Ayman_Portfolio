<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#16253b" />
      <stop offset="45%" stop-color="#0d1624" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Geometric Tech Grid Accents -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(45, 212, 191, 0.15)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  
  <!-- Outer Satellite Dots -->
  <circle cx="256" cy="16" r="4" fill="#2dd4bf" filter="url(#softGlow)" />
  <circle cx="496" cy="256" r="4" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="256" cy="496" r="4" fill="#2dd4bf" filter="url(#softGlow)" />
  <circle cx="16" cy="256" r="4" fill="#818cf8" filter="url(#softGlow)" />
  <circle cx="425" cy="87" r="3" fill="#5eead4" />
  <circle cx="87" cy="425" r="3" fill="#5eead4" />

  <!-- Inner Badge Plate -->
  <circle cx="256" cy="256" r="165" fill="#0c1422" stroke="rgba(45, 212, 191, 0.4)" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(45, 212, 191, 0.12)" stroke-width="1" stroke-dasharray="4 6" />

  <!-- Subtle Ambient Core Glow -->
  <circle cx="256" cy="245" r="95" fill="#14b8a6" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Central Name Character / Monogram: Arabic "أ" & English "AY" -->
  <g id="character-symbol" filter="url(#neonGlow)">
    <!-- English Initials Moniker subtle at top -->
    <text
      x="256"
      y="152"
      text-anchor="middle"
      fill="#5eead4"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-size="20"
      font-weight="800"
      letter-spacing="6"
      opacity="0.9"
    >AYMAN</text>

    <!-- Majestic Arabic Name Character: "أ" (Alif with Hamza) -->
    <!-- Hamza (ء) -->
    <path
      d="M268 180 C276 172, 284 174, 282 186 C280 196, 268 200, 260 206 C254 210, 248 214, 240 216 L272 216 C276 216, 278 219, 278 222 C278 225, 275 228, 270 228 L232 228 C226 228, 224 223, 226 218 C230 211, 240 205, 248 200 C258 193, 264 188, 262 182 C260 178, 254 178, 250 181 C246 184, 244 184, 242 182 C240 180, 242 176, 246 173 C252 168, 262 168, 268 180 Z"
      fill="url(#primaryGrad)"
    />

    <!-- Alif Stem (ا) - Bold, sculptural, modern -->
    <path
      d="M246 248 C246 242, 252 238, 258 238 C264 238, 270 242, 270 248 L270 342 C270 348, 264 352, 258 352 C252 352, 246 348, 246 342 Z"
      fill="url(#primaryGrad)"
    />
  </g>

  <!-- Surrounding Monogram Subtext: "أيمن الشهري" -->
  <text
    x="256"
    y="392"
    text-anchor="middle"
    fill="#ffffff"
    font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, Cairo, Arial, sans-serif"
    font-size="28"
    font-weight="900"
    letter-spacing="1"
    filter="url(#softGlow)"
  >أيمن الشهري</text>

  <!-- Domain Tagline at Bottom -->
  <text
    x="256"
    y="424"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="3"
  >DATA &amp; BUSINESS INTELLIGENCE</text>

  <!-- Modern Accent Crosshairs -->
  <line x1="256" y1="92" x2="256" y2="108" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
  <line x1="248" y1="100" x2="264" y2="100" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
  
  <line x1="100" y1="256" x2="116" y2="256" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
  <line x1="396" y1="256" x2="412" y2="256" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
</svg>
